<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 构建产物使用相对路径（vite base './'）以支持 code-server 的 /proxy/<port>/ 前缀；
         这里把 <base> 固定到应用根目录，避免打开 /role/xxx 等多级路由时资源 404 导致白屏。 -->
    <script>
      (function () {
        var m = location.pathname.match(/^(.+\/proxy\/\d+\/)/);
        document.write('<base href="' + (m ? m[1] : "/") + '">');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobNavigator-IT · IT 职业规划</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
