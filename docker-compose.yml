version: "3.9"

services:
  # ── Frontend (Nginx + React SPA) ────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: jobnav-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend API (FastAPI) ───────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: jobnav-api
    env_file: .env
    environment:
      JOBNAV_APP_ENV: docker
      JOBNAV_POSTGRES_DSN: postgresql://jobnav:jobnav@postgres:5432/jobnavigator
      JOBNAV_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/v1/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Vector seeding (one-shot: generate embeddings → pgvector) ──
  vector-seed:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: jobnav-vector-seed
    environment:
      JOBNAV_POSTGRES_DSN: postgresql://jobnav:jobnav@postgres:5432/jobnavigator
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pipelines.taxonomy.build_job_vectors"]
    profiles: ["seed"]

  # ── PostgreSQL + pgvector ───────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobnav-postgres
    environment:
      POSTGRES_DB: jobnavigator
      POSTGRES_USER: jobnav
      POSTGRES_PASSWORD: jobnav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnav -d jobnavigator"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobnav-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
